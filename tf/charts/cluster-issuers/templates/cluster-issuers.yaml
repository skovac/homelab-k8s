{{- range $name, $server := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    email: {{ required "email is required" $.Values.email | quote }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      # One certificate per hostname via HTTP-01 (no DNS API access needed).
      - http01:
          ingress:
            ingressClassName: {{ $.Values.ingressClassName }}
{{- end }}
